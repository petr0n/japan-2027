<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPY ⇄ USD</title>
<style>
  :root {
    --text: #37352f;
    --muted: #787774;
    --line: #e9e9e7;
    --field: #f7f7f5;
    --focus: #2383e2;
    --warn: #c4554d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --text: #e3e2e0;
      --muted: #9b9a97;
      --line: #373737;
      --field: #252525;
      --warn: #e07a72;
    }
    body { background: #191919; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font: 15px/1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
  }
  .pair {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
  }
  label {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 10px 14px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  label:focus-within { border-color: var(--focus); }
  .sym { font-size: 26px; color: var(--muted); }
  input {
    width: 100%;
    min-width: 0;
    border: 0;
    background: transparent;
    color: inherit;
    font-family: inherit;
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    outline: none;
  }
  .swap { color: var(--muted); font-size: 18px; }
  .rate {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    color: var(--muted);
    font-size: 13px;
  }
  .rate input {
    width: 7ch;
    font-size: 13px;
    font-weight: 500;
    padding: 2px 6px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--field);
  }
  .rate input:focus { border-color: var(--focus); }
  #status.warn { color: var(--warn); }
  @media (max-width: 420px) {
    .pair { grid-template-columns: 1fr; }
    .swap { display: none; }
  }
</style>
</head>
<body>
  <div class="pair">
    <label><span class="sym">¥</span><input id="jpy" inputmode="decimal" autocomplete="off" aria-label="Japanese yen" value="1000"></label>
    <span class="swap" aria-hidden="true">⇄</span>
    <label><span class="sym">$</span><input id="usd" inputmode="decimal" autocomplete="off" aria-label="US dollars"></label>
  </div>
  <div class="rate">
    <span>1 USD =</span>
    <input id="rate" inputmode="decimal" autocomplete="off" aria-label="Yen per US dollar" value="160">
    <span>JPY.</span>
    <span id="status">Loading the latest rate…</span>
  </div>

<script>
  const FALLBACK_RATE = 160;
  const jpy = document.getElementById('jpy');
  const usd = document.getElementById('usd');
  const rate = document.getElementById('rate');
  const status = document.getElementById('status');

  const parse = (el) => parseFloat(el.value.replace(/[^0-9.]/g, ''));
  const yen = (n) => Math.round(n).toLocaleString('en-US');
  const dollars = (n) => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function fromJpy() {
    const r = parse(rate), v = parse(jpy);
    usd.value = r > 0 && v >= 0 ? dollars(v / r) : '';
  }

  function fromUsd() {
    const r = parse(rate), v = parse(usd);
    jpy.value = r > 0 && v >= 0 ? yen(v * r) : '';
  }

  jpy.addEventListener('input', fromJpy);
  usd.addEventListener('input', fromUsd);
  rate.addEventListener('input', () => {
    status.textContent = 'Using your rate.';
    status.className = '';
    fromJpy();
  });

  fromJpy();

  fetch('https://api.frankfurter.dev/v1/latest?base=USD&symbols=JPY')
    .then((res) => {
      if (!res.ok) throw new Error(res.status);
      return res.json();
    })
    .then((data) => {
      rate.value = data.rates.JPY.toFixed(2);
      const date = new Date(data.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      status.textContent = `ECB reference rate, ${date}. Card rates differ.`;
      fromJpy();
    })
    .catch(() => {
      rate.value = FALLBACK_RATE;
      status.textContent = 'The live rate didn’t load. Edit the rate to match your card.';
      status.className = 'warn';
      fromJpy();
    });
</script>
</body>
</html>
